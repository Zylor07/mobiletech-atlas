services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mobiletech-atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mobiletech_atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
    ports:
      - "5432:5432"
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d mobiletech_atlas"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  atlas_postgres_data:
